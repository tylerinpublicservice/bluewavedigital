<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact - BlueWave Digital</title>
<meta name="description" content="Get in touch with BlueWave Digital by email, phone or WhatsApp."/>
<link rel="icon" type="image/png" href="https://i.ibb.co/MDHS2J5v/Blue-Wave-Digital-New-Logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/style.css"/>
</head>
<body>
<div id="nav"></div>
<section class="page-head"><div class="wrap reveal"><div class="eyebrow">Contact</div>
<h1>Let's talk</h1>
<p>Send us a message and we'll get back to you shortly. Based in Seychelles, working worldwide.</p></div></section>
<section class="block"><div class="wrap">
<div class="form-box reveal">
<div id="msg"></div>
<div class="field"><label>Name</label><input id="c-name" placeholder="Your name"/></div>
<div class="field"><label>Email</label><input id="c-email" type="email" placeholder="you@example.com"/></div>
<div class="field"><label>Phone / WhatsApp (optional)</label><input id="c-phone" placeholder="+248 ..."/></div>
<div class="field"><label>Message</label><textarea id="c-message" placeholder="How can we help?"></textarea></div>
<button class="btn btn-primary btn-block" id="c-send">Send message</button>
<p class="note center" style="margin-top:1rem">Prefer email? <a href="mailto:hello@bluewaveagency.online" style="color:var(--bright)">hello@bluewaveagency.online</a></p>
</div></div></section>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/app.js"></script>
<script>
document.getElementById('c-send').onclick=async()=>{
  const name=document.getElementById('c-name').value.trim();
  const email=document.getElementById('c-email').value.trim();
  const phone=document.getElementById('c-phone').value.trim();
  const message=document.getElementById('c-message').value.trim();
  const msg=document.getElementById('msg');
  if(!name||!email||!message){msg.innerHTML='<div class="alert alert-bad">Please fill in your name, email and message.</div>';return;}
  const{error}=await db.from('contact_messages').insert({name,email,phone,message});
  if(error){msg.innerHTML='<div class="alert alert-bad">Something went wrong. Please try again or email us directly.</div>';return;}
  location.href='/thank-you/';
};
</script>
</body>
</html>
