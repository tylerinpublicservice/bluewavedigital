<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Approvals - BlueWave Portal</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/MDHS2J5v/Blue-Wave-Digital-New-Logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="/assets/style.css"/></head><body>
<div class="dash"><aside class="dash-side">
<a class="brand" href="/" style="margin-bottom:1.4rem"><img src="https://i.ibb.co/MDHS2J5v/Blue-Wave-Digital-New-Logo.png"/><span>BlueWave</span></a>
<a href="/portal/" class="">Dashboard</a><a href="/portal/projects/" class="">Projects</a><a href="/portal/invoices/" class="">Invoices</a><a href="/portal/files/" class="">Files</a><a href="/portal/approvals/" class="active">Approvals</a><a href="/portal/support/" class="">Support</a><a href="#" onclick="signOut();return false;" style="margin-top:1rem;color:var(--bad)">Log out</a></aside>
<main class="dash-main"><div class="dash-top"><h1>Approvals</h1><div id="who" class="note"></div></div>
<div id="content"><div class="panel"><p class="muted">Loading...</p></div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/app.js"></script>
<script>
(async()=>{try{const P=await requireRole('client');if(!P)return;document.getElementById('who').textContent=P.full_name||P.email;
const cid=P.client_id;
async function load(){
 const ap=(await db.from('approvals').select('*, projects!inner(client_id,name)').eq('projects.client_id',cid).order('created_at')).data||[];
 document.getElementById('content').innerHTML=`<div class="panel"><h3>Approvals</h3>${ap.length?ap.map(a=>`<div style="padding:.9rem 0;border-bottom:1px solid var(--card-line)"><b>${esc(a.title)}</b> <span class="badge ${a.status==='approved'?'badge-ok':(a.status==='changes_requested'?'badge-warn':'badge-new')}">${esc(a.status)}</span><p class="muted">${esc(a.description||'')}</p>${a.status==='awaiting'?`<button class="btn btn-primary btn-sm" onclick="respond('${a.id}','approved')">Approve</button> <button class="btn btn-ghost btn-sm" onclick="respond('${a.id}','changes_requested')">Request changes</button>`:''}</div>`).join(''):'<p class="muted">Nothing waiting for your approval.</p>'}</div>`;
}
window.respond=async(id,status)=>{await db.from('approvals').update({status,responded_at:new Date().toISOString()}).eq('id',id);load();};
load();
}catch(e){document.getElementById('content').innerHTML='<div class="panel alert alert-bad">Error: '+esc(e.message)+'</div>';}})();
</script></body></html>
